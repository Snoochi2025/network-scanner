# Base44 sandbox environment for the Network Scanner.
#
# What this project needs (read from the source):
#   - Python 3 only. `network_scanner.py` imports just `socket` from the standard
#     library, so there is no requirements.txt, no lockfile and no build step.
#   - No database, cache or queue.
#   - No external service, so no credentials/secrets are required.
#
# It is a one-shot console script, not a web application: it prints its result
# and exits. The service below therefore runs from the cloned source over a bind
# mount (so edits are picked up on the next run without rebuilding anything) and
# deliberately has no automatic restart.
services:
  scanner:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "network_scanner.py"]
